name: CI

on:
  push:
    branches: [main, production-hardening, multi-tenant-isolation]
  pull_request:
    branches: [main, production-hardening]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Syntax checks
        run: |
          node --check server.js
          node --check agent.js
          node --check store.js
          node --check whatsapp.js
      - name: Storage regression test
        run: node tests/storage.test.js
      - name: Auth and property verification regression test
        run: node tests/property-verification.test.js
      - name: Tenant isolation regression test
        run: node tests/tenant-isolation.test.js
